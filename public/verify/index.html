<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Shared certificate links land here (…/verify/?AUX-XXXXX-XXXXX). Link previews (WhatsApp, Facebook, X,
         LinkedIn, Telegram) read the tags below; people are sent straight on to the verify page in the app. -->
    <title>Verified Auxa certificate</title>
    <meta name="description" content="A piano certificate earned and verified on Auxa Academy. Tap to check it, and learn piano with a teacher that listens." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auxa Academy" />
    <meta property="og:title" content="Verified Auxa piano certificate" />
    <meta property="og:description" content="Earned on Auxa Academy. Tap to check it, and learn piano with a teacher that listens." />
    <meta property="og:image" content="https://juliusklahai.github.io/Auxa-academy/og-certificate.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A verified Auxa Academy piano certificate" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Verified Auxa piano certificate" />
    <meta name="twitter:description" content="Earned on Auxa Academy. Tap to check it, and learn piano with a teacher that listens." />
    <meta name="twitter:image" content="https://juliusklahai.github.io/Auxa-academy/og-certificate.png" />
    <meta name="theme-color" content="#14161c" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=auxa" />
    <script>
      (function () {
        var raw = (location.search.slice(1) || location.hash.slice(1)).split('&')[0];
        var code = decodeURIComponent(raw.replace(/^(code|c)=/, '')).replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
        location.replace('../' + (code ? '#/verify/' + encodeURIComponent(code) : ''));
      })();
    </script>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14161c;color:#aab2bf;font:16px Inter,system-ui,sans-serif}a{color:#14f0e4}</style>
  </head>
  <body><p>Opening the certificate… <a href="../">Auxa Academy</a></p></body>
</html>
