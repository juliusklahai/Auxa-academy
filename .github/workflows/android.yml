name: Android app
on:
  push:
    branches: [native, accounts, main]
    paths: ['native/android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_URL: ${{ github.ref_name == 'main' && 'https://juliusklahai.github.io/maestro-academy/' || 'https://juliusklahai.github.io/maestro-academy/preview/' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Release key (when added as GitHub secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; echo "ANDROID_KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV; fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk Maestro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Maestro-android
          path: native/android/Maestro.apk
      - name: Publish a download link (test build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-test
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --title "Maestro for Android (test build)" --notes "Test build of the Maestro Android app. Download Maestro.apk on your phone and open it to install."
          gh release upload $TAG Maestro.apk --clobber
          gh release edit $TAG --notes "Test build $VERSION_NAME of the Maestro Android app (opens $START_URL). Download Maestro.apk on your phone and open it to install."
